<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lawyer Profile | Diamond Advocates</title><meta name="description" content="Diamond Advocates lawyer profile."><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/responsive.css"></head><body><a class="skip-link" href="#main">Skip to content</a><div data-site-header></div><main id="main"><section class="section" style="padding-top:160px"><div class="container"><nav class="breadcrumb" style="color:var(--slate-500)"><a href="index.html">Home</a><span>/</span><a href="team.html">Our Team</a><span>/</span><span data-person-name>Galandi Tony Kiire</span></nav><div class="profile-layout"><div class="profile-portrait"><img data-person-photo src="images/team-galandi.png" alt="Galandi Tony Kiire"></div><div class="profile-copy"><p class="eyebrow">Our team</p><h1 data-person-name>Galandi Tony Kiire</h1><p class="profile-role" data-person-role>Managing Partner</p><h2>Biography</h2><div class="profile-bio" data-person-bio></div><div class="rule"></div><h3>Connect with the firm</h3><p>For enquiries, contact the Diamond Advocates office.</p><div class="button-row"><a class="btn btn--navy" href="contact.html">Book appointment</a><a class="text-link" href="mailto:info@diamondadvocates.com">Email the firm <span>→</span></a></div></div></div></div></section><section class="section--compact section--ivory"><div class="container" style="display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap"><a class="text-link" href="team.html">← All team members</a><a class="text-link" href="team-profile.html?person=baluku">Next profile →</a></div></section></main><div data-site-footer></div><script src="js/components.js"></script><script>
const people={
galandi:['Galandi Tony Kiire','Managing Partner','team-galandi.png',[`Tony Kiire is the Founding and Managing Partner of Diamond Advocates, where he leads the Technology, Innovation, and Intellectual Property Law practice. He is also the founder of Lawtech Associates and Consult, the company behind the Legal AI Research Assistant and the Mtetezi App, which connects clients with legal professionals. A recognized legal tech and AI advisor, Tony has collaborated with local and international institutions, including the Makerere AI Health Lab, and serves on a Government of Uganda Ministry of Health committee shaping national AI in health policy. Beyond technology, Tony is a versatile arbitrator and a member of the Chartered Institute of Arbitrators (CIArb-UK), with notable expertise in land transactions and a proven track record of successfully resolving complex disputes. His contributions to the legal technology space have earned him recognition, including the Uganda Law Society Presidential Appreciation Award for chairing the inaugural Tech Fest, Uganda's first-ever legal tech event that brought together over 600 participants, and the Uganda Law Society Digital Excellence Award for leading a pioneering legal practice at the forefront of innovation and legal technology. He holds a Master's in Institutional Leadership & Management (UMI), a Postgraduate Diploma in Legal Practice (Law Development Centre), and an LLB from Makerere University. Tony is an active member of the Uganda Law Society, East African Law Society, Chartered Institute of Arbitrators, Uganda Christian Lawyers Fraternity, and the Rotary Club Kampala North.`]],
baluku:['Baluku David I.','Principal Associate','team-baluku.png',[`Baluku David is an Associate in the Litigation, Taxation, and Corporate Advisory Departments, with a strong passion for Intellectual Property Law, Revenue and Taxation Law, Company Law, Banking and Finance, Estate Planning, Artificial Intelligence, Oil and Gas, and Technology, Media, and Telecommunications Law. He combines solid academic training with practical experience to deliver innovative legal solutions, particularly where emerging technologies intersect with traditional legal frameworks. Idembe is committed to providing strategic guidance that is both legally sound and commercially viable. He holds a Post Graduate Diploma in Legal Practice from the Law Development Centre and a Bachelor of Laws (LLB) from Makerere University, and he is an active member of the Uganda Law Society and the Uganda Christian Lawyers Fraternity.`]],
masika:['Masika Sandra','Principal Associate','team-masika.png',[`Sandra is an Advocate of the High Court of Uganda and all subordinate courts, with a dynamic and evolving practice spanning multiple areas of law.`,`She has extensive experience in Family Law, Human Rights Law, Criminal Law, Employment Law and Land Conveyancing, with a particular focus on family, human rights, employment, real estate transactions, policy analysis and property development.`,`She combines meticulous legal analysis with practical solutions tailored to the client's objectives, helping individuals, businesses, and developers navigate complex legal and regulatory frameworks. Currently serving as a Principal Associate at the firm, Sandra is recognized for her commitment to excellence, client advocacy, and strategic problem-solving. She holds a Post Graduate Diploma in Legal Practice from the Law Development Centre and a Bachelor of Laws (LLB) from Uganda Christian University. She is an active member of the Uganda Law Society and continues to engage in professional development initiatives to stay at the forefront of legal practice in Uganda.`,`She is a member of the Uganda Law Society, East African Law Society, and Uganda Christian Lawyers Fraternity.`]],
muzingu:['Muzingu Richard','Legal Associate','team-muzingu.png',[`Muzingu Richard is an Advocate of the High Court of Uganda and all subordinate courts, with a dynamic legal practice spanning Land Law, Real Estate, Succession, and Corporate & Commercial Practice. He advises clients on complex transactions, regulatory compliance, and strategic legal planning, offering expertise in property acquisitions, leasing, development projects, due diligence, and dispute resolution. His succession practice focuses on estate planning, wills, and administration, helping clients preserve and transfer assets efficiently. In corporate & commercial practice, he advises businesses on formation, governance, regulatory compliance, mergers & acquisitions, and commercial contracts. He holds a Bachelor of Laws (LLB) Honours degree from Makerere University and a Post Graduate Diploma in Legal Practice from the Law Development Centre, where he graduated with a First Class and doubled as an awardee of the prestigious Director's List Award of Top Performers for the academic year 2021/2022. As an active member of the Uganda Law Society, he remains committed to continuous professional growth and delivering forward-thinking legal solutions.`]],
priscilla:['Priscilla Nayiga','Associate','team-priscilla.png',[`Priscilla is an Associate with experience in fintech law, corporate finance, and regulatory advisory. Her practice focuses on advising fintech companies, financial institutions, and technology-enabled businesses on digital financial services regulation, fintech licensing, consumer protection, AML/CFT compliance, and digital identity and e-KYC requirements. She regularly supports clients in navigating complex regulatory frameworks and engaging effectively with sector regulators, providing practical, business-oriented solutions in fast-evolving digital markets. Priscilla also brings strong policy and research expertise, having contributed to public-sector digital transformation initiatives through legal and regulatory analysis on data protection, interoperability, and the governance of digital public infrastructure. She is particularly valued for her ability to translate complex regulatory developments into clear, commercially sound legal guidance that enables informed decision-making. She holds a Master of Laws (LL.M) and a Bachelor of Laws (LL.B) from Makerere University, and a Postgraduate Diploma in Legal Practice from the Law Development Centre.`]],
akello:['Akello Mercy','Legal Assistant','team-akello.png',[`Akello Mercy is a Legal Assistant with growing expertise in Tax Law, Real Estate Law and Company Law. She supports the firm and clients by providing research, drafting, compliance reviews, and transaction support across diverse legal matters. In tax practice, she assists with compliance assessments, preparation for audits, and dispute resolution processes, ensuring clients are well-prepared and guided through regulatory requirements. She also contributes to structuring transactions for tax efficiency under the supervision of senior counsel. In real estate, Akello has been actively involved in land due diligence, conveyancing, preparation of leases and mortgages, and documentation for property transactions. Her company law practice includes supporting corporate clients in business registration, corporate governance, regulatory compliance, and preparation of commercial agreements. Akello holds a Bachelor of Laws degree from Uganda Christian University and a Postgraduate Diploma in Legal Practice from the Law Development Centre.`]],
magada:['Magada Julius','Legal Assistant','team-magada.png',[`Magada Julius is a Legal Assistant specializing in Real Estate, Succession, and Company Law. In the area of real estate, he supports the firm in handling property transactions, including conveyancing, title searches, verification of land records, preparation and review of sale agreements, and registration of transfers. In succession law, Julius provides support in estate administration, drafting and reviewing wills, managing inheritance documentation, and guiding clients through procedural requirements for the distribution of estates. He assists in both contested and uncontested succession matters. In Company Law, he assists with corporate compliance, including preparation and review of company formation documents, maintenance of statutory registers, drafting of shareholders' agreements, and support for mergers, acquisitions, and other corporate transactions. Julius holds a Bachelor of Laws (LL.B) from Kampala International University and a Postgraduate Diploma in Legal Practice from the Law Development Centre.`]],
ndijjo:['Ndijjo Samuel','Legal Associate','team-ndijjo.png',[`Ndijjo Samuel is a Legal Associate at the firm with a strong focus on Real Estate Law and Corporate Finance. In real estate, Samuel is actively engaged in all aspects of property transactions, including due diligence, conveyancing, drafting and reviewing leases, mortgages, and other property agreements. He has experience supporting land acquisitions and developments. In corporate finance, Samuel assists in structuring financing arrangements, drafting and reviewing loan and security documentation, and ensuring regulatory compliance with financial institutions and governing bodies. He supports clients in navigating financing processes, including debt structuring, investment transactions, and corporate restructuring. Samuel is also actively engaged in Employment Law practice, Sports administration and management. Samuel holds a Bachelor of Laws degree from Uganda Christian University and a Postgraduate Diploma in Legal Practice from the Law Development Centre.`]]
};
const key=new URLSearchParams(location.search).get('person')||'galandi';const person=people[key]||people.galandi;document.querySelectorAll('[data-person-name]').forEach(e=>e.textContent=person[0]);document.querySelector('[data-person-role]').textContent=person[1];document.title=`${person[0]} | Diamond Advocates`;const photo=document.querySelector('[data-person-photo]');photo.src=`images/${person[2]}`;photo.alt=person[0];document.querySelector('[data-person-bio]').innerHTML=person[3].map(p=>`<p>${p}</p>`).join('');</script><script src="js/vendor/lenis.min.js"></script><script src="js/smooth-scroll.js"></script><script src="js/main.js"></script><script src="js/animations.js"></script></body></html>
